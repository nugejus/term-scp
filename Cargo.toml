[package]
name = "term-scp"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.30.2"
russh-sftp = "3.0.1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "time", "sync"] }
clap = { version = "4.6", features = ["derive"] }
unicode-normalization = "0.1.26"
unicode-width = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3.27"
